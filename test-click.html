<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test Click</title></head>
<body>
<h1>Test Click</h1>
<input id="topicInput" value="Que es ciencia">
<button id="searchBtn">INVESTIGAR</button>
<pre id="output">Esperando...</pre>
<script>
document.getElementById('searchBtn').addEventListener('click', () => {
    document.getElementById('output').textContent = 
        'Click detectado!\n' +
        'Input value: ' + document.getElementById('topicInput').value + '\n' +
        'Timestamp: ' + Date.now();
});
</script>
</body>
</html>
